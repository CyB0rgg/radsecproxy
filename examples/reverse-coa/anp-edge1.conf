# radsecproxy, ANP-side proxy with reverse CoA, one of two at the site (edge1).
#
# Both edges take NAS connections and both connect to the IDP proxy. The IDP proxy sends
# a CoA-Request or Disconnect-Request down either connection. The edge that receives it
# delivers it when it holds the NAS, and otherwise hands it to the other edge over the
# sibling link below, once. anp-edge2.conf is this file with the names swapped.

LogLevel        3
LogDestination  file:///var/log/radsecproxy/anp-edge1.log

ListenTLS       *:2083
ListenUDP       *:1812
ListenUDP       *:1813

# Same key on both edges and on the IDP proxy.
ReverseCoATokenKey <32-or-more-random-characters>

tls default {
    CACertificateFile       /etc/radsecproxy/ca.pem
    CertificateFile         /etc/radsecproxy/anp-edge1.pem
    CertificateKeyFile      /etc/radsecproxy/anp-edge1.key
}

rewrite addoperatorname {
    # Operator-Name namespace '4' = WBAID; use your own identifier.
    addAttribute 126:'4EXAMPLE:GB
}

# The NASes, as in anp-proxy.conf: a fleet on one certificate here.
client nas-fleet {
    type        tls
    host        0.0.0.0/0
    secret      radsec
    tls         default
    CertificateNameCheck  off
    matchCertificateAttribute CN:/^nas-/
    NASidentifier /.*/
    ReverseCoAOperatorRealm 4EXAMPLE:GB
    rewriteIn   addoperatorname
    addOperatorNASIdentifier on
    reverseCoATimeout 30
}

# The sibling link, inbound: edge2 connects here and hands over requests for NASes on
# this edge. Nothing else is routed on this connection.
client anp-edge2 {
    type        tls
    host        <anp-edge2-address>
    secret      radsec
    tls         default
    CertificateNameCheck  off
    matchCertificateAttribute CN:/^anp-edge2\.example\.net$/
    reverseCoASibling on
}

# The sibling link, outbound: this edge connects to edge2 and hands over requests for
# NASes there. A request received on it is delivered here or answered, never handed on.
server anp-edge2 {
    type        tls
    host        <anp-edge2-address>
    port        2083
    secret      radsec
    tls         default
    CertificateNameCheck  off
    matchCertificateAttribute CN:/^anp-edge2\.example\.net$/
    statusServer on
    reverseCoASibling on
}

# The IDP-side proxy, as in anp-proxy.conf.
server idp-proxy {
    type        tls
    host        <idp-proxy-address>
    port        2083
    secret      radsec
    tls         default
    CertificateNameCheck  off
    matchCertificateAttribute CN:/^idp-proxy\.example\.net$/
    statusServer on
    acceptReverseCoA on
}

realm /.*/ {
    server      idp-proxy
    accountingServer idp-proxy
}
