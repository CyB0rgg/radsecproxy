# radsecproxy, ANP-side proxy with reverse CoA.
#
# The NAS connects to this proxy (RadSec, or plain UDP). On the way to the IDP proxy every
# Access-Request and Accounting-Request gets Operator-Name (RFC 5580) and a keyed
# Operator-NAS-Identifier (RFC 8559 section 3.4). A CoA-Request or Disconnect-Request
# arriving from the IDP proxy on the existing TLS connection is matched to the NAS by that
# Operator-NAS-Identifier (or by NAS-Identifier / NAS-IP-Address), stripped of
# Operator-Name and Operator-NAS-Identifier, and delivered on the NAS's own connection.

LogLevel        3
LogDestination  file:///var/log/radsecproxy/anp-proxy.log

ListenTLS       *:2083
ListenUDP       *:1812
ListenUDP       *:1813

# Same key as the IDP proxy.
ReverseCoATokenKey <32-or-more-random-characters>

tls default {
    CACertificateFile       /etc/radsecproxy/ca.pem
    CertificateFile         /etc/radsecproxy/anp-proxy.pem
    CertificateKeyFile      /etc/radsecproxy/anp-proxy.key
}

rewrite addoperatorname {
    # Operator-Name namespace '4' = WBAID; use your own identifier.
    addAttribute 126:'4EXAMPLE:GB
}

# A NAS that speaks RadSec and accepts CoA on its own connection
# (MikroTik RouterOS 7.23, hostapd with the reverse CoA series, ...). One block per NAS
# with a literal NASidentifier; for many NASes on one certificate use one block with
# `host 0.0.0.0/0` and `NASidentifier /.*/`, as in single-proxy.conf.
client nas-radsec {
    type        tls
    host        <nas-address>
    secret      radsec
    tls         default
    CertificateNameCheck  off
    NASidentifier <nas-identifier-as-sent-by-the-nas>
    ReverseCoAOperatorRealm 4EXAMPLE:GB
    rewriteIn   addoperatorname
    addOperatorNASIdentifier on
    reverseCoATimeout 30
}

# For a NAS that has no reverse CoA of its own, see anp-proxy-udp-nas.conf.

# The IDP-side proxy. acceptReverseCoA lets it send CoA/Disconnect down this connection.
server idp-proxy {
    type        tls
    host        <idp-proxy-address>
    port        2083
    secret      radsec
    tls         default
    CertificateNameCheck  off
    matchCertificateAttribute CN:/^idp-proxy\.example\.net$/
    statusServer on
    acceptReverseCoA on
}

realm /.*/ {
    server      idp-proxy
    accountingServer idp-proxy
}
