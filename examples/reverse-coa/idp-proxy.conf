# radsecproxy, IDP-side (or hub) proxy with reverse CoA.
#
# Access-Request and Accounting-Request come in from the ANP proxy over TLS and go to the
# home RADIUS server. A CoA-Request or Disconnect-Request from a local originator on
# 127.0.0.1:3799 is sent back down the ANP proxy's connection whose
# ReverseCoAOperatorRealm matches the request's Operator-Name (RFC 8559 section 3.2).
#
# The originator must include the Operator-Name and the Operator-NAS-Identifier that the
# home server recorded from the Access-Request for that session, verbatim (RFC 8559 4.1).

LogLevel        3
LogDestination  file:///var/log/radsecproxy/idp-proxy.log

ListenTLS       *:2083
ListenUDP       127.0.0.1:3799

# Same key on every proxy that mints or routes by Operator-NAS-Identifier.
ReverseCoATokenKey <32-or-more-random-characters>

tls default {
    CACertificateFile       /etc/radsecproxy/ca.pem
    CertificateFile         /etc/radsecproxy/idp-proxy.pem
    CertificateKeyFile      /etc/radsecproxy/idp-proxy.key
}

# The ANP proxy. Reverse CoA for its operator goes down this connection.
client anp-proxy {
    type        tls
    host        <anp-proxy-address-or-0.0.0.0/0-with-a-certificate-match>
    secret      radsec
    tls         default
    CertificateNameCheck  off
    matchCertificateAttribute CN:/^anp-proxy\.example\.net$/
    ReverseCoAOperatorRealm 4EXAMPLE:GB
    # a connection that died unnoticed keeps its route, and a request sent down it is
    # lost without an answer; drop it after silence (the ANP proxy sends Status-Server)
    idleTimeout 180
    tcpKeepalive on
}

# Where CoA-Request and Disconnect-Request come from on this host
# (radclient, a RADIUS server with a CoA home server on loopback, or tools/coaprobe.py).
client originator {
    type        udp
    host        127.0.0.1
    secret      <coa-secret>
    acceptCoA   on
    reverseCoAFallback on
    DuplicateInterval 255
}

server home {
    type        udp
    host        127.0.0.1
    port        1812
    secret      <home-secret>
    statusServer on
}

realm /.*/ {
    server      home
    accountingServer home
}
