# The RADIUS server as the CoA originator. Its CoA-Request / Disconnect-Request must carry
# Operator-Name (echo it from the accounting) and name the NAS.
client originator {
    type        udp
    host        127.0.0.1
    secret      <coa-secret>
    acceptCoA on
    reverseCoAFallback on
}

server home {
    type        udp
    host        127.0.0.1
    port        1812
    secret      <radius-secret>
}

server home-acct {
    type        udp
    host        127.0.0.1
    port        1813
    secret      <radius-secret>
}

realm /.*/ {
    server      home
    accountingServer home-acct
}
