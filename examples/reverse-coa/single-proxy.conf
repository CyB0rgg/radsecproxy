# radsecproxy, single proxy: the NAS connects straight to the proxy in front of the home
# RADIUS server. No ANP-side proxy. The NAS block is the one from anp-proxy.conf and the
# originator block is the one from idp-proxy.conf, in the same instance.
#
# On the way to the RADIUS server every Access-Request and Accounting-Request gets
# Operator-Name and a keyed Operator-NAS-Identifier. A CoA-Request or Disconnect-Request
# from the originator (the RADIUS server, on loopback) carrying Operator-Name and naming the
# NAS by NAS-Identifier or NAS-IP-Address is delivered on the NAS's own RadSec connection.

LogLevel        3
LogDestination  file:///var/log/radsecproxy/proxy.log

ListenTLS       *:2083
ListenUDP       127.0.0.1:3799

ReverseCoATokenKey <32-or-more-random-characters>

tls default {
    CACertificateFile       /etc/radsecproxy/ca.pem
    CertificateFile         /etc/radsecproxy/proxy.pem
    CertificateKeyFile      /etc/radsecproxy/proxy.key
}

rewrite addoperatorname {
    # Operator-Name namespace '4' = WBAID; use your own identifier.
    addAttribute 126:'4EXAMPLE:GB
}

# The fleet: every NAS presenting this certificate, from anywhere. NASidentifier as a
# regexp makes the block a fleet of NASes rather than a proxy; each connection is the
# NAS whose own NAS-Identifier (failing that, NAS-IP-Address) it has sent, learned from
# its requests. The Operator-NAS-Identifier it gets on the way up names the connection by
# certificate and source address, so a CoA carrying it reaches the right NAS even when
# the whole fleet shares one certificate.
client nas-fleet {
    type        tls
    host        0.0.0.0/0
    secret      radsec
    tls         default
    CertificateNameCheck  off
    matchCertificateAttribute CN:/^nas-fleet\.example\.net$/
    NASidentifier /.*/
    ReverseCoAOperatorRealm 4EXAMPLE:GB
    rewriteIn   addoperatorname
    addOperatorNASIdentifier on
    reverseCoATimeout 30
}

# Or one block per NAS, named by a literal NASidentifier; a certificate per NAS is the
# cleaner deployment where you can have it.
