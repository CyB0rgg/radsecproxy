# radsecproxy, ANP-side proxy: client block for a NAS WITHOUT reverse CoA.
#
# Add this client to anp-proxy.conf instead of (or next to) nas-radsec. The NAS talks
# ordinary RADIUS/UDP to this proxy, and a CoA-Request or Disconnect-Request that arrives
# from the IDP proxy over RadSec is delivered to the NAS as a standard RFC 5176 request on
# UDP 3799 (CoAPort), using the client's secret. The reverse CoA path is unchanged up to
# this proxy; only the last hop is UDP, so any NAS that supports RFC 5176 can take part.

# A NAS without reverse CoA: it talks UDP to this proxy, and the CoA is delivered to it
# as an ordinary RFC 5176 request on UDP 3799 (the "local breakout"). The NAS needs the
# same secret for incoming CoA as for RADIUS.
client nas-udp {
    type        udp
    host        <nas-address>
    secret      <nas-secret>
    NASidentifier <nas-identifier-as-sent-by-the-nas>
    ReverseCoAOperatorRealm 4EXAMPLE:GB
    CoAPort     3799
    rewriteIn   addoperatorname
    addOperatorNASIdentifier on
    reverseCoATimeout 30
}

