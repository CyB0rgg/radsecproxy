# radsecproxy configuration, reverse-coa-poc build.
#
# Nothing is configured yet, so the service exits at start with a configuration error.
# Start from one of the examples in /usr/share/doc/radsecproxy/examples/reverse-coa/
# (idp-proxy.conf, anp-proxy.conf, single-proxy.conf, anp-edge1.conf and anp-edge2.conf
# for a site with two proxies), then:
#
#   systemctl enable --now radsecproxy
#
# The options are described in radsecproxy.conf(5); the reverse CoA ones are
# ReverseCoATokenKey, ReverseCoARetryOnNak, ReverseCoAOperatorRealm, NASidentifier,
# addOperatorNASIdentifier, acceptCoA, reverseCoAFallback, acceptReverseCoA,
# reverseCoASibling and CoAPort.
