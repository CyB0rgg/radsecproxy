name: reverse-coa-poc build

on:
  push:
    branches: [reverse-coa-poc]
    tags: ['reverse-coa-poc-*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  ubuntu:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config libssl-dev
          curl -sSfL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build
        run: |
          autoreconf -fi
          ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var
          make -j"$(nproc)"
      - name: Test
        run: make check
      - name: Package
        run: |
          tools/package.sh ubuntu22.04
          tools/package-nfpm.sh deb
      - uses: actions/upload-artifact@v4
        with:
          name: radsecproxy-reverse-coa-poc-ubuntu22.04-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  rocky:
    name: Rocky Linux 9 x86_64
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y gcc make autoconf automake libtool pkgconf-pkg-config openssl-devel git diffutils tar gzip
          dnf install -y https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm-2.48.0-1.x86_64.rpm
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fi
          ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var
          make -j"$(nproc)"
      - name: Test
        run: make check
      - name: Package
        run: |
          tools/package.sh rocky9
          tools/package-nfpm.sh rpm
      - uses: actions/upload-artifact@v4
        with:
          name: radsecproxy-reverse-coa-poc-rocky9-x86_64
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radsecproxy
          tags="-t ${image}:reverse-coa-poc -t ${image}:reverse-coa-poc-${GITHUB_SHA::7}"
          case "${GITHUB_REF}" in refs/tags/reverse-coa-poc-*) tags="${tags} -t ${image}:${GITHUB_REF_NAME}" ;; esac
          docker build --build-arg COMMIT="${GITHUB_SHA}" ${tags} .
          docker push --all-tags "${image}"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/reverse-coa-poc-')
    needs: [ubuntu, rocky, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$(printf 'reverse-coa-poc build from %s.\n\nA .deb (Debian 12+, Ubuntu 22.04+), an .rpm (RHEL family 9), the same two builds as tarballs, each with a .sha256, and a container image:\n\n    docker pull ghcr.io/%s/radsecproxy:%s\n\nPackage page: https://github.com/%s/pkgs/container/radsecproxy\n\nSee README.md on the branch: https://github.com/%s/tree/reverse-coa-poc' "${GITHUB_SHA}" "${GITHUB_REPOSITORY_OWNER,,}" "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${GITHUB_REPOSITORY}")"
